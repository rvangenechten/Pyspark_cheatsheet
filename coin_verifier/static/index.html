<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Coin Verifier</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: #0d1117; color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #8b949e; margin: 0 0 16px; }
  .filters { color: #8b949e; margin-bottom: 16px; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #21262d; white-space: nowrap; }
  th { color: #8b949e; font-weight: 600; font-size: 12px; text-transform: uppercase; }
  td.summary { white-space: normal; max-width: 360px; color: #c9d1d9; }
  tr:hover { background: #161b22; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge.ok { background: #133929; color: #3fb950; }
  .badge.warn { background: #3a2a10; color: #d29922; }
  a { color: #58a6ff; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .empty { color: #8b949e; padding: 40px 0; text-align: center; }
  .src { color: #6e7681; font-size: 11px; }
  .refresh { float: right; background: #21262d; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
</style>
</head>
<body>
  <button class="refresh" onclick="load(true)">Refresh</button>
  <h1>Coin Verifier</h1>
  <p class="sub">New tokens with a verified, cross-linked website + Twitter/X (both mention the ticker, and link to each other).</p>
  <p class="filters" id="filters"></p>
  <table id="tbl">
    <thead>
      <tr>
        <th>Chain</th><th>Name</th><th>Symbol</th><th>Price</th><th>Mcap</th>
        <th>Age (h)</th><th>Holders</th><th>Website</th><th>Twitter</th><th>Summary</th><th>Flags</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">No tokens currently pass all checks.</div>

<script>
function fmtUsd(n) {
  if (n === null || n === undefined) return "—";
  if (n >= 1e6) return "$" + (n / 1e6).toFixed(2) + "M";
  if (n >= 1e3) return "$" + (n / 1e3).toFixed(1) + "k";
  return "$" + Number(n).toFixed(2);
}

async function load(forceRefresh) {
  const url = "/api/tokens?only_verified=true" + (forceRefresh ? "&refresh=true" : "");
  const res = await fetch(url);
  const data = await res.json();
  const f = data.filters;
  document.getElementById("filters").textContent =
    `min mcap ${fmtUsd(f.minMarketCapUsd)} · min holders ${f.minHolders} · max age ${f.maxAgeHours}h · ${data.count} shown`;

  const rows = document.getElementById("rows");
  rows.innerHTML = "";
  document.getElementById("empty").style.display = data.tokens.length ? "none" : "block";

  for (const t of data.tokens) {
    rows.appendChild(buildRow(t));
  }
}

// Every string below originates from a token's own website or its DexScreener
// listing - i.e. attacker-controlled. Build cells with textContent/DOM APIs,
// never innerHTML, or a token site can ship script into this page.
function cell(text) {
  const td = document.createElement("td");
  td.textContent = text ?? "—";
  return td;
}

function linkCell(url, label) {
  const td = document.createElement("td");
  if (!url || !/^https?:\/\//i.test(url)) {
    td.textContent = "—";
    return td;
  }
  const a = document.createElement("a");
  a.href = url;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.textContent = label;
  td.appendChild(a);
  return td;
}

function buildRow(t) {
  const tr = document.createElement("tr");
  tr.appendChild(cell(t.chain));
  tr.appendChild(linkCell(t.pairUrl, t.name));
  tr.appendChild(cell("$" + t.symbol));
  tr.appendChild(cell(t.priceUsd ? Number(t.priceUsd).toPrecision(4) : "—"));
  tr.appendChild(cell(fmtUsd(t.marketCapUsd)));
  tr.appendChild(cell(t.ageHours ?? "—"));
  tr.appendChild(cell(t.holders ?? "—"));
  tr.appendChild(linkCell(t.website, "site"));
  tr.appendChild(linkCell(t.twitter, "x"));

  const summaryTd = document.createElement("td");
  summaryTd.className = "summary";
  if (t.category) {
    const badge = document.createElement("span");
    badge.className = "badge ok";
    badge.textContent = t.category;
    summaryTd.appendChild(badge);
    summaryTd.appendChild(document.createTextNode(" "));
  }
  summaryTd.appendChild(document.createTextNode(t.summary || ""));
  if (t.summarySource === "extractive") {
    const note = document.createElement("span");
    note.className = "src";
    note.textContent = " (from page text)";
    summaryTd.appendChild(note);
  }
  tr.appendChild(summaryTd);

  const flagsTd = document.createElement("td");
  flagsTd.className = "summary";
  for (const flag of t.redFlags || []) {
    const badge = document.createElement("span");
    badge.className = "badge warn";
    badge.textContent = flag;
    flagsTd.appendChild(badge);
    flagsTd.appendChild(document.createTextNode(" "));
  }
  tr.appendChild(flagsTd);

  return tr;
}

load(false);
setInterval(() => load(false), 60000);
</script>
</body>
</html>
